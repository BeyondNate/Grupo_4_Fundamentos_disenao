<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Galería ESP32-CAM</title>
 <style>
   * {
     margin: 0;
     padding: 0;
     box-sizing: border-box;
   }


   body {
     font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
     background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
     min-height: 100vh;
     padding: 20px;
   }


   .container {
     max-width: 1200px;
     margin: 0 auto;
   }


   .nav {
     background: rgba(255,255,255,0.2);
     backdrop-filter: blur(10px);
     padding: 15px;
     border-radius: 10px;
     margin-bottom: 20px;
     display: flex;
     gap: 10px;
   }


   .nav a {
     color: white;
     text-decoration: none;
     padding: 10px 20px;
     border-radius: 5px;
     transition: background 0.3s;
   }


   .nav a:hover, .nav a.active {
     background: rgba(255,255,255,0.3);
   }


   header {
     text-align: center;
     color: white;
     margin-bottom: 30px;
   }


   h1 {
     font-size: 2.5rem;
     margin-bottom: 10px;
     text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
   }


   .stats {
     background: rgba(255,255,255,0.2);
     backdrop-filter: blur(10px);
     padding: 15px;
     border-radius: 10px;
     display: inline-block;
     color: white;
     margin-bottom: 20px;
   }


   .controls {
     display: flex;
     justify-content: center;
     gap: 10px;
     margin-bottom: 30px;
   }


   button {
     background: white;
     border: none;
     padding: 12px 24px;
     border-radius: 8px;
     cursor: pointer;
     font-size: 1rem;
     font-weight: 600;
     color: #667eea;
     transition: all 0.3s;
     box-shadow: 0 4px 6px rgba(0,0,0,0.1);
   }


   button:hover {
     transform: translateY(-2px);
     box-shadow: 0 6px 12px rgba(0,0,0,0.2);
   }


   button:disabled {
     opacity: 0.5;
     cursor: not-allowed;
   }


   .gallery {
     display: grid;
     grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
     gap: 20px;
   }


   .photo-card {
     background: white;
     border-radius: 12px;
     overflow: hidden;
     box-shadow: 0 4px 6px rgba(0,0,0,0.1);
     transition: transform 0.3s;
     cursor: pointer;
   }


   .photo-card:hover {
     transform: translateY(-5px);
     box-shadow: 0 8px 16px rgba(0,0,0,0.2);
   }


   .photo-card img {
     width: 100%;
     height: 200px;
     object-fit: cover;
     background: #f0f0f0;
   }


   .photo-info {
     padding: 15px;
   }


   .photo-name {
     font-weight: 600;
     color: #333;
     margin-bottom: 5px;
     white-space: nowrap;
     overflow: hidden;
     text-overflow: ellipsis;
   }


   .photo-date {
     font-size: 0.85rem;
     color: #666;
   }


   .loading {
     text-align: center;
     color: white;
     font-size: 1.2rem;
     padding: 40px;
   }


   .error {
     background: #ff4444;
     color: white;
     padding: 15px;
     border-radius: 8px;
     text-align: center;
     margin: 20px 0;
   }


   .modal {
     display: none;
     position: fixed;
     top: 0;
     left: 0;
     width: 100%;
     height: 100%;
     background: rgba(0,0,0,0.9);
     z-index: 1000;
     justify-content: center;
     align-items: center;
     flex-direction: column;
   }


   .modal.active {
     display: flex;
   }


   .modal img {
     max-width: 90%;
     max-height: 80%;
     border-radius: 8px;
     object-fit: contain;
   }


   .modal-info {
     color: white;
     margin-top: 15px;
     text-align: center;
   }


   .modal-close {
     position: absolute;
     top: 20px;
     right: 30px;
     font-size: 40px;
     color: white;
     cursor: pointer;
     background: none;
     border: none;
     padding: 0;
     width: auto;
   }
 </style>
</head>
<body>
 <div class="container">
   <nav class="nav">
     <a href="/"><i class="fas fa-seedling"></i> Sensores</a>
     <a href="/galeria" class="active"><i class="fas fa-camera"></i> Galería</a>
   </nav>


   <header>
     <h1>📸 Galería ESP32-CAM</h1>
     <div class="stats" id="stats">
       Cargando...
     </div>
   </header>


   <div class="controls">
     <button onclick="loadGallery()" id="refreshBtn">
       🔄 Actualizar
     </button>
   </div>


   <div id="gallery" class="gallery">
     <div class="loading">Cargando fotos...</div>
   </div>
 </div>


 <div class="modal" id="modal">
   <button class="modal-close" onclick="closeModal()">&times;</button>
   <img id="modalImg" src="" alt="">
   <div class="modal-info" id="modalInfo"></div>
 </div>


 <script>
   async function loadGallery() {
     const gallery = document.getElementById('gallery');
     const stats = document.getElementById('stats');
     const refreshBtn = document.getElementById('refreshBtn');


     refreshBtn.disabled = true;
     gallery.innerHTML = '<div class="loading">Cargando fotos...</div>';


     try {
       const response = await fetch('/api/gallery/photos');
       const data = await response.json();


       if (data.error) {
         throw new Error(data.error);
       }


       stats.textContent = `${data.count} foto${data.count !== 1 ? 's' : ''} encontrada${data.count !== 1 ? 's' : ''}`;


       if (data.count === 0) {
         gallery.innerHTML = '<div class="loading">No hay fotos aún</div>';
         return;
       }


       gallery.innerHTML = '';


       data.photos.forEach(photo => {
         const card = createPhotoCard(photo);
         gallery.appendChild(card);
       });


     } catch (error) {
       gallery.innerHTML = `<div class="error">Error: ${error.message}</div>`;
       console.error('Error:', error);
     } finally {
       refreshBtn.disabled = false;
     }
   }


   function createPhotoCard(photo) {
     const card = document.createElement('div');
     card.className = 'photo-card';


     // Al hacer clic en la tarjeta, abrir en el modal
     card.onclick = () => openModal(photo);


     const date = new Date(photo.date);
     const formattedDate = date.toLocaleDateString('es-PE', {
       day: '2-digit',
       month: 'short',
       year: 'numeric',
       hour: '2-digit',
       minute: '2-digit'
     });


     card.innerHTML = `
       <img src="${photo.thumbnail}" alt="${photo.name}" loading="lazy"
            onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'height:200px; display:flex; align-items:center; justify-content:center; color:#666;\'>📷 Imagen no disponible</div>'">
       <div class="photo-info">
         <div class="photo-name">${photo.name}</div>
         <div class="photo-date">${formattedDate}</div>
       </div>
     `;


     return card;
   }


   function openModal(photo) {
     const modal = document.getElementById('modal');
     const modalImg = document.getElementById('modalImg');
     const modalInfo = document.getElementById('modalInfo');


     // Usar la imagen de alta calidad si está disponible, sino usar el thumbnail
     const imageUrl = photo.download || photo.thumbnail || photo.url;


     modalImg.src = imageUrl;
     modalInfo.textContent = `${photo.name} - ${new Date(photo.date).toLocaleString('es-PE')}`;
     modal.classList.add('active');
   }


   function closeModal() {
     const modal = document.getElementById('modal');
     const modalImg = document.getElementById('modalImg');


     modal.classList.remove('active');
     modalImg.src = ''; // Limpiar src para liberar memoria
   }


   // Cerrar modal con ESC
   document.addEventListener('keydown', (e) => {
     if (e.key === 'Escape') closeModal();
   });


   // Cerrar modal haciendo clic fuera de la imagen
   document.getElementById('modal').addEventListener('click', (e) => {
     if (e.target.id === 'modal') {
       closeModal();
     }
   });


   // Cargar galería al iniciar y cada 30 segundos
   loadGallery();
   setInterval(loadGallery, 30000);
 </script>
</body>
</html>
